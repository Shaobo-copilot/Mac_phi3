<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alien Signal Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            margin-bottom: 10px;
        }

        .toolbar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #dc3545 0%, #bd2130 100%);
            color: white;
        }

        .btn-random {
            background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
            color: #1a1a2e;
        }

        .input-section {
            display: flex;
            flex-direction: column;
        }
        
        .signals-container, .planet-container {
            display: inline-block;
            width: 48%;
            vertical-align: top;
        }
        
        .signals-container {
            margin-right: 2%;
        }
        
        .planet-container {
            margin-left: 2%;
        }
        
        .main-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .panel-title {
            font-size: 1.2em;
            color: #00d4ff;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(0, 212, 255, 0.3);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #aaa;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
        }

        .checkbox-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .checkbox-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .checkbox-item input[type="checkbox"] {
            margin-top: 4px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-info h4 {
            font-size: 14px;
            margin-bottom: 4px;
        }

        .checkbox-info p {
            font-size: 12px;
            color: #888;
        }

        .planet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
        }

        .planet-card {
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .planet-card:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .planet-card.selected {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
        }

        .planet-card h4 {
            color: #00d4ff;
            margin-bottom: 5px;
        }

        .planet-card p {
            font-size: 12px;
            color: #888;
        }

        .slider-container {
            margin-bottom: 15px;
        }

        .slider-value {
            float: right;
            color: #00d4ff;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #00d4ff;
            cursor: pointer;
        }

        .generate-btn {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            margin-top: 20px;
        }

        .result-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .result-card {
            background: rgba(0, 212, 255, 0.1);
            border-radius: 12px;
            padding: 25px;
            border-left: 4px solid #00d4ff;
        }

        .result-text {
            font-size: 1.1em;
            line-height: 1.8;
            color: #fff;
            margin-bottom: 20px;
        }

        .result-meta {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .meta-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
        }

        .meta-item h5 {
            color: #00d4ff;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .meta-item p {
            font-size: 13px;
            color: #ccc;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .history-table th,
        .history-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .history-table th {
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
            font-weight: 600;
        }

        .history-table tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .history-table button {
            padding: 6px 12px;
            font-size: 12px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .selected-count {
            background: #00d4ff;
            color: #1a1a2e;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛸 Alien Signal Generator</h1>
            <p style="color: #888;">外星文明信号解读器</p>
        </header>

        <div class="toolbar">
            <button class="btn btn-success" onclick="exportData()">
                📤 导出 JSON
            </button>
            <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">
                📥 导入 JSON
            </button>
            <input type="file" id="fileInput" accept=".json" onchange="importData(this)">
            <button class="btn btn-danger" onclick="clearHistory()">
                🗑️ 清空历史
            </button>
        </div>

        <!-- 顶部生成控制区域 -->
        <div class="panel" style="margin-bottom: 20px;">
            <h2 class="panel-title">🚀 快速生成控制</h2>
            
            <div class="form-group" style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                <button class="btn btn-random" onclick="randomizePlanet()">
                    🎲 随机星球
                </button>
                
                <button class="btn btn-random" onclick="randomizeSignals()">
                    🎲 随机信号
                </button>
                
                <button class="btn btn-primary generate-btn" onclick="generateResult()" style="min-width: 120px;">
                    🚀 生成结果
                </button>
                
                <div style="flex-grow: 1;"></div>
                
                <label class="form-label" style="margin-bottom: 0;">
                    批量生成数量:
                </label>
                <input type="number" id="batchCount" placeholder="输入生成次数" min="1" max="1000" style="width: 120px; padding: 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white;">
                
                <div style="display: flex; gap: 15px;">
                    <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                        <input type="checkbox" id="randomPlanetToggle" checked> 随机星球
                    </label>
                    <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                        <input type="checkbox" id="randomSignalToggle" checked> 随机信号
                    </label>
                </div>
                
                <button class="btn btn-success" onclick="startBatchGeneration()" style="min-width: 120px;">
                    🚀 批量生成
                </button>
            </div>
        </div>

        <div class="main-layout">
            <div class="left-panel">
                <div class="panel">
                    <h2 class="panel-title">⚙️ 参数配置</h2>
                    
                    <div class="input-section">
                        <div class="signals-container">
                            <div class="form-group">
                                <label class="form-label">
                                    选择信号 (3 个)
                                    <span class="selected-count" id="signalCount">0/3</span>
                                </label>
                                <div class="checkbox-group" id="signalList"></div>
                            </div>
                        </div>
                        
                        <div class="planet-container">
                            <div class="form-group">
                                <label class="form-label">选择星球</label>
                                <div class="planet-grid" id="planetList"></div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            Temperature
                            <span class="slider-value" id="tempValue">0.7</span>
                        </label>
                        <div class="slider-container">
                            <input type="range" id="temperature" min="0.1" max="1.5" step="0.1" value="0.7" oninput="document.getElementById('tempValue').textContent=this.value">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            Max Tokens
                            <span class="slider-value" id="tokensValue">80</span>
                        </label>
                        <div class="slider-container">
                            <input type="range" id="maxTokens" min="20" max="200" step="10" value="80" oninput="document.getElementById('tokensValue').textContent=this.value">
                        </div>
                    </div>
                </div>
            </div>

            <div class="right-panel">
                <div class="panel">
                    <h2 class="panel-title">✨ 生成结果</h2>
                    <div class="loading" id="loading">
                        <div class="spinner"></div>
                        <p>正在生成中...</p>
                    </div>
                    <div class="result-panel" id="resultPanel">
                        <div style="text-align: center; color: #666; padding: 40px;">
                            <p>配置参数后点击"生成结果"按钮</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="panel">
            <h2 class="panel-title">📊 历史记录</h2>
            <table class="history-table">
                <thead>
                    <tr>
                        <th>时间</th>
                        <th>信号</th>
                        <th>星球</th>
                        <th>结果预览</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="historyBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let signals = [];
        let planets = [];
        let history = [];
        let selectedSignals = new Set();
        let selectedPlanet = null;

        // 初始化
        async function init() {
            console.log('=== Starting initialization ===');
            try {
                await loadSignals();
                console.log('✓ Signals loaded:', signals.length);
            } catch (err) {
                console.error('✗ Failed to load signals:', err);
                document.getElementById('signalList').innerHTML = '<p style="color:red">Error: ' + err.message + '</p>';
            }
            try {
                await loadPlanets();
                console.log('✓ Planets loaded:', planets.length);
            } catch (err) {
                console.error('✗ Failed to load planets:', err);
                document.getElementById('planetList').innerHTML = '<p style="color:red">Error: ' + err.message + '</p>';
            }
            loadHistory();
            console.log('=== Initialization complete ===');
        }

        async function loadSignals() {
            console.log('📡 Fetching signals...');
            const res = await fetch('/api/signals');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            signals = await res.json();
            console.log('📥 Signals received:', signals.map(s => s.name));
            renderSignals();
        }

        async function loadPlanets() {
            console.log('🪐 Fetching planets...');
            const res = await fetch('/api/planets');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            planets = await res.json();
            console.log('📥 Planets received:', planets.map(p => p.name));
            renderPlanets();
        }

        function renderSignals() {
            const container = document.getElementById('signalList');
            container.innerHTML = signals.map(s => `
                <label class="checkbox-item">
                    <input type="checkbox" value="${s.name}" ${selectedSignals.has(s.name) ? 'checked' : ''} onchange="toggleSignal('${s.name}')">
                    <div class="checkbox-info">
                        <h4>${s.name}</h4>
                        <p>${s.semantic_tags.join(', ')}</p>
                    </div>
                </label>
            `).join('');
        }

        function renderPlanets() {
            const container = document.getElementById('planetList');
            container.innerHTML = planets.map(p => `
                <div class="planet-card ${selectedPlanet === p.name ? 'selected' : ''}" onclick="selectPlanet('${p.name}')">
                    <h4>${p.name}</h4>
                    <p><strong>文明:</strong> ${p.civilization_type}</p>
                    <p><strong>感知:</strong> ${p.perception_style}</p>
                </div>
            `).join('');
        }

        function toggleSignal(name) {
            if (selectedSignals.has(name)) {
                selectedSignals.delete(name);
            } else {
                if (selectedSignals.size >= 3) {
                    alert('最多选择 3 个信号！');
                    return;
                }
                selectedSignals.add(name);
            }
            updateSignalCount();
            renderSignals();
        }

        function selectPlanet(name) {
            selectedPlanet = name;
            renderPlanets();
        }

        function randomizePlanet() {
            const random = planets[Math.floor(Math.random() * planets.length)];
            selectedPlanet = random.name;
            renderPlanets();
        }

        function randomizeSignals() {
            const shuffled = [...signals].sort(() => 0.5 - Math.random());
            const randomSignals = shuffled.slice(0, 3);
            
            selectedSignals.clear();
            
            randomSignals.forEach(signal => {
                selectedSignals.add(signal.name);
            });
            
            updateSignalCount();
            renderSignals();
        }

        function updateSignalCount() {
            document.getElementById('signalCount').textContent = `${selectedSignals.size}/3`;
        }

        let batchResults = []; // 存储批量生成的结果
        
        async function generateResult() {
            if (selectedSignals.size !== 3) {
                alert('请选择 exactly 3 个信号！');
                return;
            }
            if (!selectedPlanet) {
                alert('请选择一个星球！');
                return;
            }

            document.getElementById('loading').classList.add('active');
            document.getElementById('resultPanel').innerHTML = '';

            const result = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    signal_names: Array.from(selectedSignals),
                    planet_name: selectedPlanet,
                    temperature: parseFloat(document.getElementById('temperature').value),
                    max_new_tokens: parseInt(document.getElementById('maxTokens').value)
                })
            }).then(res => res.json());

            document.getElementById('loading').classList.remove('active');
            console.log('✓ Result received:', result);
            displayResult(result);
            addToHistory(result);
        }

        // ============================================================
        // 修复后的函数 1：displayResult()
        // ============================================================
        function displayResult(data) {
            console.log('Display data:', data);  // 调试用
            
            // 处理新的后端 API 格式
            if (data.sections) {
                // 新格式：sections + metadata
                const sections = data.sections;
                const metadata = data.metadata;
                
                let html = '';
                
                // 显示元数据（星球、文明、信号等）
                html += `
                    <div class="result-card">
                        <div class="result-meta">
                            <div class="meta-item">
                                <h5>🪐 观测星球</h5>
                                <p>${escapeHtml(metadata.planet.name)}</p>
                            </div>
                            <div class="meta-item">
                                <h5>🧠 文明类型</h5>
                                <p>${escapeHtml(metadata.civilization_type)}</p>
                            </div>
                            <div class="meta-item">
                                <h5>👁️ 感知方式</h5>
                                <p>${escapeHtml(metadata.perception_style)}</p>
                            </div>
                            <div class="meta-item">
                                <h5>📡 接收信号</h5>
                                <p>${metadata.signals.map(s => s.name).join(', ')}</p>
                            </div>
                        </div>
                    </div>
                `;
                
                // 显示各个 section
                const sectionOrder = [
                    { key: 'semantic_interpretation', icon: '📝', title: '语义解释' },
                    { key: 'civilization_context', icon: '🏛️', title: '文明背景' },
                    { key: 'perception_influence', icon: '👁️', title: '感知影响' },
                    { key: 'final_conclusion', icon: '🎯', title: '综合结论' }
                ];
                
                for (const section of sectionOrder) {
                    const sectionData = sections[section.key];
                    if (sectionData && sectionData.content) {
                        html += `
                            <div class="result-card">
                                <h4 style="color: #00d4ff; margin-bottom: 12px; display: flex; align-items: center;">
                                    <span style="margin-right: 8px;">${section.icon}</span>
                                    ${sectionData.title}
                                </h4>
                                <div class="result-text">${escapeHtml(sectionData.content)}</div>
                            </div>
                        `;
                    }
                }
                
                // 如果没有任何 sections，显示 raw_text 作为备选
                const hasContent = Object.values(sections).some(s => s && s.content);
                if (!hasContent && data.raw_text) {
                    html += `
                        <div class="result-card">
                            <h4 style="color: #ffc107;">⚠️ 原始输出</h4>
                            <div class="result-text">${escapeHtml(data.raw_text)}</div>
                        </div>
                    `;
                }
                
                document.getElementById('resultPanel').innerHTML = html;
            } 
            // 中间格式：新字段但没有sections结构
            else if (data.result) {
                // 从后端API获取的格式
                let html = '';
                
                // 显示元数据（星球、信号等）
                html += `
                    <div class="result-card">
                        <div class="result-meta">
                            <div class="meta-item">
                                <h5>🪐 观测星球</h5>
                                <p>${escapeHtml(data.planet ? data.planet.name : '未知')}</p>
                            </div>
                            <div class="meta-item">
                                <h5>📡 接收信号</h5>
                                <p>${data.signals ? data.signals.map(s => s.name).join(', ') : '未知'}</p>
                            </div>
                            <div class="meta-item">
                                <h5>⏰ 生成时间</h5>
                                <p>${new Date(data.timestamp).toLocaleString()}</p>
                            </div>
                        </div>
                    </div>
                `;
                
                // 显示生成的主要内容
                html += `
                    <div class="result-card">
                        <h4 style="color: #00d4ff; margin-bottom: 12px;">🚀 生成结果</h4>
                        <div class="result-text">${escapeHtml(data.result)}</div>
                    </div>
                `;
                
                document.getElementById('resultPanel').innerHTML = html;
            }
            // 向后兼容：旧格式
            else if (data.planet_analysis) {
                document.getElementById('resultPanel').innerHTML = `
                    <div class="result-card">
                        <h4 style="color: #00d4ff; margin-bottom: 12px;">🪐 星球分析</h4>
                        <div class="result-text">${escapeHtml(data.planet_analysis)}</div>
                    </div>
                    <div class="result-card">
                        <h4 style="color: #00d4ff; margin-bottom: 12px;">🏛️ 文明分析</h4>
                        <div class="result-text">${escapeHtml(data.civilization_analysis)}</div>
                    </div>
                    <div class="result-card">
                        <h4 style="color: #00d4ff; margin-bottom: 12px;">👁️ 感知分析</h4>
                        <div class="result-text">${escapeHtml(data.perception_analysis)}</div>
                    </div>
                    <div class="result-card">
                        <h4 style="color: #00d4ff; margin-bottom: 12px;">📡 信号分析</h4>
                        <div class="result-text">${escapeHtml(data.signal_analysis)}</div>
                    </div>
                `;
            }
        }

        // ============================================================
        // 修复后的函数 2：addToHistory()
        // ============================================================
        function addToHistory(data) {
            console.log('Adding to history:', data);
            
            let resultText = '';
            
            // 新格式
            if (data.sections) {
                resultText = Object.values(data.sections)
                    .filter(s => s && s.content)
                    .map(s => `${s.title}: ${s.content}`)
                    .join(' | ')
                    .substring(0, 150);
            }
            // 中间格式：从API返回的数据
            else if (data.result) {
                resultText = data.result.substring(0, 150);
            }
            // 旧格式
            else if (data.signal_analysis) {
                resultText = data.signal_analysis.substring(0, 150);
            }
            
            // 获取星球和信号数据
            let planetData, signalsData;
            if (data.metadata) {
                // 新格式
                planetData = data.metadata.planet;
                signalsData = data.metadata.signals;
            } else if (data.planet) {
                // API返回格式
                planetData = data.planet;
                signalsData = data.signals;
            } else {
                // 旧格式
                planetData = data.planet_info;
                signalsData = data.signals || [];
            }
            
            const entry = {
                id: Date.now(),
                timestamp: data.timestamp || (data.metadata ? data.metadata.timestamp : new Date().toISOString()),
                signals: signalsData ? signalsData.map(s => s.name).join(', ') : 'Unknown',
                planet: planetData ? planetData.name : 'Unknown',
                result: resultText,
                planet_info: planetData,
                sections: data.sections || null,
                full_data: data
            };
            
            history.unshift(entry);
            renderHistory();
            saveHistory();
        }

        function renderHistory() {
            const tbody = document.getElementById('historyBody');
            tbody.innerHTML = history.map(h => `
                <tr>
                    <td>${new Date(h.timestamp).toLocaleString()}</td>
                    <td>${h.signals}</td>
                    <td>${h.planet}</td>
                    <td style="max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${escapeHtml(h.result)}</td>
                    <td>
                        <button class="btn btn-primary" onclick="loadHistoryEntry(${h.id})">加载</button>
                    </td>
                </tr>
            `).join('');
        }

        function loadHistoryEntry(id) {
            const entry = history.find(h => h.id === id);
            if (entry) {
                if (entry.full_data) {
                    displayResult(entry.full_data);
                } else {
                    const reconstructedData = {
                        planet_analysis: `关于${entry.planet}的分析`,
                        civilization_analysis: `文明分析：${entry.planet_info.civilization_type}`,
                        perception_analysis: `感知方式：${entry.planet_info.perception_style}`,
                        signal_analysis: entry.result,
                        signals: [],
                        planet: entry.planet_info,
                        timestamp: entry.timestamp
                    };
                    displayResult(reconstructedData);
                }
            }
        }

        function clearHistory() {
            if (confirm('确定要清空所有历史记录吗？')) {
                history = [];
                renderHistory();
                saveHistory();
            }
        }

        function exportData() {
            const data = {
                history: history,
                exportedAt: new Date().toISOString()
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `alien_signals_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.history && Array.isArray(data.history)) {
                        history = data.history;
                        renderHistory();
                        saveHistory();
                        alert(`成功导入 ${history.length} 条记录！`);
                    } else {
                        alert('无效的 JSON 格式！');
                    }
                } catch (err) {
                    alert('读取文件失败：' + err.message);
                }
            };
            reader.readAsText(file);
            input.value = '';
        }

        function saveHistory() {
            localStorage.setItem('alien_signals_history', JSON.stringify(history));
        }

        function loadHistory() {
            const saved = localStorage.getItem('alien_signals_history');
            if (saved) {
                try {
                    history = JSON.parse(saved);
                    renderHistory();
                } catch (err) {
                    console.error('加载历史失败:', err);
                }
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 批量生成功能
        async function startBatchGeneration() {
            const count = parseInt(document.getElementById('batchCount').value);
            if (!count || count <= 0) {
                alert('请输入有效的生成数量！');
                return;
            }
            
            if (count > 100) {
                if (!confirm(`您要批量生成 ${count} 条数据，这可能需要较长时间，是否继续？`)) {
                    return;
                }
            }

            const randomPlanetEnabled = document.getElementById('randomPlanetToggle').checked;
            const randomSignalEnabled = document.getElementById('randomSignalToggle').checked;

            document.getElementById('loading').classList.add('active');
            document.getElementById('resultPanel').innerHTML = `<div style="text-align: center; padding: 20px; color: #00d4ff;">正在批量生成中... (0/${count})</div>`;
            
            // 保存原始选择，以便在固定模式下恢复
            const originalSelectedSignals = new Set(selectedSignals);
            const originalSelectedPlanet = selectedPlanet;

            // 清空之前的批量结果
            batchResults = [];

            for (let i = 0; i < count; i++) {
                // 根据设置决定是否随机化
                if (randomPlanetEnabled) {
                    randomizePlanet();
                } else {
                    // 如果不随机，则保持原来的选择
                    selectedPlanet = originalSelectedPlanet;
                    renderPlanets();
                }
                
                if (randomSignalEnabled) {
                    randomizeSignals();
                } else {
                    // 如果不随机，则保持原来的选择
                    selectedSignals = new Set(originalSelectedSignals);
                    updateSignalCount();
                    renderSignals();
                }
                
                // 更新进度
                document.getElementById('resultPanel').innerHTML = `<div style="text-align: center; padding: 20px; color: #00d4ff;">正在批量生成中... (${i+1}/${count})</div>`;
                
                try {
                    // 调用生成函数
                    const result = await generateSingleResultForBatch();
                    batchResults.push(result); // 收集结果
                } catch (error) {
                    console.error('批量生成错误:', error);
                    alert(`在生成第 ${i+1} 条时发生错误: ${error.message}`);
                    break;
                }
            }

            document.getElementById('loading').classList.remove('active');
            
            // 显示批量生成完成信息和结果概览
            let resultsHTML = `<div style="text-align: center; padding: 20px; color: #00d4ff; margin-bottom: 20px;">批量生成完成！共生成 ${count} 条结果。</div>`;
            
            // 显示最近的几个结果（比如最新的5个）
            const recentCount = Math.min(5, batchResults.length);
            resultsHTML += `<div style="text-align: center; margin-bottom: 15px; color: #aaa;">以下是最新 ${recentCount} 条结果：</div>`;
            
            // 显示最近的结果
            for (let i = batchResults.length - recentCount; i < batchResults.length; i++) {
                const result = batchResults[i];
                if (result) {
                    let previewText = '无预览';
                    if (result.sections) {
                        previewText = Object.values(result.sections)
                            .filter(s => s && s.content)
                            .map(s => s.content.substring(0, 100))
                            .join(' ... ');
                    } else if (result.result) {
                        previewText = result.result.substring(0, 150);
                    } else if (result.signal_analysis) {
                        previewText = result.signal_analysis.substring(0, 150);
                    }
                    
                    resultsHTML += `
                        <div class="result-card" style="margin-bottom: 15px;">
                            <div class="result-meta" style="margin-bottom: 10px;">
                                <div class="meta-item">
                                    <h5>🪐 星球</h5>
                                    <p>${result.metadata ? result.metadata.planet.name : (result.planet ? result.planet.name : 'N/A')}</p>
                                </div>
                                <div class="meta-item">
                                    <h5>📡 信号</h5>
                                    <p>${result.metadata ? result.metadata.signals.map(s => s.name).join(', ') : (result.signals ? result.signals.map(s => s.name).join(', ') : 'N/A')}</p>
                                </div>
                            </div>
                            <div class="result-text" style="font-size: 0.9em; color: #ccc;">${escapeHtml(previewText)}...</div>
                        </div>
                    `;
                }
            }
            
            // 添加按钮让用户查看所有结果
            if (batchResults.length > 0) {
                resultsHTML += `<div style="text-align: center; margin-top: 20px;">
                    <button class="btn btn-primary" onclick="showAllBatchResults()" style="padding: 10px 20px;">查看所有 ${batchResults.length} 条结果</button>
                </div>`;
            }
            
            document.getElementById('resultPanel').innerHTML = resultsHTML;
            
            // 恢复原始选择
            selectedSignals = originalSelectedSignals;
            selectedPlanet = originalSelectedPlanet;
            renderSignals();
            renderPlanets();
        }

        // 单次生成函数（用于批量生成内部调用）
        async function generateSingleResultForBatch() {
            if (selectedSignals.size !== 3) {
                throw new Error('请选择 exactly 3 个信号！');
            }
            if (!selectedPlanet) {
                throw new Error('请选择一个星球！');
            }

            const result = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    signal_names: Array.from(selectedSignals),
                    planet_name: selectedPlanet,
                    temperature: parseFloat(document.getElementById('temperature').value),
                    max_new_tokens: parseInt(document.getElementById('maxTokens').value)
                })
            }).then(res => res.json());

            console.log('✓ Result received:', result);
            addToHistory(result); // 添加到历史记录
            return result; // 返回结果供批量收集
        }

        // 显示所有批量生成结果
        function showAllBatchResults() {
            if (!batchResults || batchResults.length === 0) {
                alert('没有批量生成的结果可以显示！');
                return;
            }

            // 创建结果面板HTML
            let resultsHTML = `<div style="text-align: center; padding: 20px; color: #00d4ff; margin-bottom: 20px;">共 ${batchResults.length} 条批量生成结果</div>`;
            
            // 反向遍历，最新的结果在最前面
            for (let i = batchResults.length - 1; i >= 0; i--) {
                const result = batchResults[i];
                if (result) {
                    // 使用现有的displayResult函数来显示每个结果
                    const resultIndex = batchResults.length - i; // 从1开始编号
                    resultsHTML += `<div class="result-card" style="margin-bottom: 20px; border-left: 4px solid #ff6b6b;">
                        <div style="text-align: right; margin-bottom: 10px; color: #ff6b6b; font-weight: bold;"># ${resultIndex}</div>`;
                    
                    // 根据结果格式显示内容
                    if (result.sections) {
                        // 新格式：sections + metadata
                        const sections = result.sections;
                        const metadata = result.metadata;
                        
                        resultsHTML += `
                            <div class="result-meta" style="margin-bottom: 15px;">
                                <div class="meta-item">
                                    <h5>🪐 观测星球</h5>
                                    <p>${escapeHtml(metadata.planet.name)}</p>
                                </div>
                                <div class="meta-item">
                                    <h5>🧠 文明类型</h5>
                                    <p>${escapeHtml(metadata.civilization_type)}</p>
                                </div>
                                <div class="meta-item">
                                    <h5>👁️ 感知方式</h5>
                                    <p>${escapeHtml(metadata.perception_style)}</p>
                                </div>
                                <div class="meta-item">
                                    <h5>📡 接收信号</h5>
                                    <p>${metadata.signals.map(s => s.name).join(', ')}</p>
                                </div>
                            </div>
                        `;
                        
                        // 显示各个 section
                        const sectionOrder = [
                            { key: 'semantic_interpretation', icon: '📝', title: '语义解释' },
                            { key: 'civilization_context', icon: '🏛️', title: '文明背景' },
                            { key: 'perception_influence', icon: '👁️', title: '感知影响' },
                            { key: 'final_conclusion', icon: '🎯', title: '综合结论' }
                        ];
                        
                        for (const section of sectionOrder) {
                            const sectionData = sections[section.key];
                            if (sectionData && sectionData.content) {
                                resultsHTML += `
                                    <div class="result-card">
                                        <h4 style="color: #00d4ff; margin-bottom: 12px; display: flex; align-items: center;">
                                            <span style="margin-right: 8px;">${section.icon}</span>
                                            ${sectionData.title}
                                        </h4>
                                        <div class="result-text">${escapeHtml(sectionData.content)}</div>
                                    </div>
                                `;
                            }
                        }
                        
                        // 如果没有任何 sections，显示 raw_text 作为备选
                        const hasContent = Object.values(sections).some(s => s && s.content);
                        if (!hasContent && result.raw_text) {
                            resultsHTML += `
                                <div class="result-card">
                                    <h4 style="color: #ffc107;">⚠️ 原始输出</h4>
                                    <div class="result-text">${escapeHtml(result.raw_text)}</div>
                                </div>
                            `;
                        }
                    } 
                    // 向后兼容：旧格式
                    else if (result.planet_analysis) {
                        resultsHTML += `
                            <div class="result-card">
                                <h4 style="color: #00d4ff; margin-bottom: 12px;">🪐 星球分析</h4>
                                <div class="result-text">${escapeHtml(result.planet_analysis)}</div>
                            </div>
                            <div class="result-card">
                                <h4 style="color: #00d4ff; margin-bottom: 12px;">🏛️ 文明分析</h4>
                                <div class="result-text">${escapeHtml(result.civilization_analysis)}</div>
                            </div>
                            <div class="result-card">
                                <h4 style="color: #00d4ff; margin-bottom: 12px;">👁️ 感知分析</h4>
                                <div class="result-text">${escapeHtml(result.perception_analysis)}</div>
                            </div>
                            <div class="result-card">
                                <h4 style="color: #00d4ff; margin-bottom: 12px;">📡 信号分析</h4>
                                <div class="result-text">${escapeHtml(result.signal_analysis)}</div>
                            </div>
                        `;
                    }
                    
                    resultsHTML += `</div>`;
                }
            }
            
            document.getElementById('resultPanel').innerHTML = resultsHTML;
        }

        // 启动
        init();
    </script>
</body>
</html>
