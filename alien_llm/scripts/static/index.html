<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alien Signal Pro - Batch Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: radial-gradient(circle at top right, #1a1a2e, #16213e);
            color: #eee;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 12px 25px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        h1 { font-size: 1.4em; color: #00d4ff; text-shadow: 0 0 10px rgba(0, 212, 255, 0.3); }

        .app-main {
            display: grid;
            grid-template-columns: 340px 1fr 320px;
            flex-grow: 1;
            overflow: hidden;
            gap: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .scroll-panel {
            background: #1a1a2e;
            height: 100%;
            overflow-y: auto;
            padding: 15px;
        }

        .panel-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00d4ff;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        /* 修改：将全屏遮罩改为右上角的浮动指示器 */

        #loadingOverlay {
            position: fixed;
            top: 5px;
            right: 300px;
            background: rgba(0, 212, 255, 0.15);
            border: 1px solid #00d4ff;
            padding: 10px 15px;
            border-radius: 8px;
            display: none; /* 默认隐藏 */
            flex-direction: row; /* 横向排列 */
            align-items: center;
            gap: 10px;
            z-index: 1000;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
            animation: pulse 2s infinite;
        }

        /* 呼吸灯动画 */
        @keyframes pulse {
            0% { box-shadow: 0 0 5px rgba(0, 212, 255, 0.2); }
            50% { box-shadow: 0 0 20px rgba(0, 212, 255, 0.5); }
            100% { box-shadow: 0 0 5px rgba(0, 212, 255, 0.2); }
        }

        /* 让加载中的图标转起来 */
        .spinner {
            animation: rotate 2s linear infinite;
            font-size: 18px;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 确保主面板不再被遮盖，去掉中间的 loading 样式 */

        /* 按钮与表单 */
        .btn-group { display: flex; gap: 6px; margin-bottom: 15px; flex-wrap: wrap; }
        .btn {
            padding: 7px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: 0.2s;
            color: white;
            background: rgba(255, 255, 255, 0.08);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-1px); }
        .btn-primary { background: #00d4ff; color: #1a1a2e; }
        .btn-success { background: #28a745; }
        .btn-danger { background: #dc3545; }
        .btn-warning { background: #ff9800; color: #1a1a2e; }

        /* 批量操作区 */
        .batch-card {
            background: rgba(0, 212, 255, 0.05);
            border: 1px dashed rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }
        .batch-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 5px 8px;
            border-radius: 4px;
            margin: 8px 0;
            font-size: 12px;
        }

        .config-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* 列表项样式 */
        .item-list { max-height: 200px; overflow-y: auto; }
        .signal-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .signal-item:hover { background: rgba(255, 255, 255, 0.05); }
        .signal-item input { accent-color: #00d4ff; }

        .planet-mini-card {
            padding: 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.04);
            margin-bottom: 5px;
            cursor: pointer;
            border-left: 3px solid transparent;
            font-size: 12px;
            transition: 0.2s;
        }
        .planet-mini-card.selected {
            border-left-color: #00d4ff;
            background: rgba(0, 212, 255, 0.12);
        }

        /* 结果展示 */
        .result-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 212, 255, 0.1);
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        .meta-box { background: rgba(0, 0, 0, 0.2); padding: 8px 12px; border-radius: 6px; }
        .meta-box label { font-size: 10px; color: #777; display: block; }
        .meta-box span { font-size: 12px; color: #00d4ff; font-weight: 600; }

        /* 历史记录项 */
        .history-item {
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: 0.2s;
        }
        .history-item:hover { border-color: rgba(0, 212, 255, 0.3); background: rgba(255, 255, 255, 0.06); }
        .history-item.active { border-color: #00d4ff; background: rgba(0, 212, 255, 0.05); }
        .history-item .time { font-size: 10px; color: #555; }
        .history-item .title { font-size: 13px; color: #eee; margin: 3px 0; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .history-item .tags { font-size: 11px; color: #888; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* 滚动条 */
        .scroll-panel::-webkit-scrollbar { width: 5px; }
        .scroll-panel::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    </style>
</head>
<body>

<header>
    <h1>🛸 Alien Signal Pro</h1>
    <div class="btn-group" style="margin-bottom: 0;">
        <button class="btn btn-success" onclick="exportData()">📤 导出</button>
        <button class="btn" onclick="document.getElementById('fileInput').click()">📥 导入</button>
        <button class="btn btn-danger" onclick="clearHistory()">🗑️ 清空</button>
        <input type="file" id="fileInput" hidden accept=".json" onchange="importData(this)">
    </div>
</header>

<main class="app-main">
    <aside class="scroll-panel">
        <div class="batch-card">
            <div class="panel-title">🚀 批量智能生成</div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <input type="number" id="batchCount" class="batch-input" value="5" min="1" max="50">
                <span style="font-size: 12px; color: #666;">组</span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 5px;">
                <label style="font-size: 11px; color: #aaa; cursor:pointer;">
                    <input type="checkbox" id="autoRandomPlanet" checked> 随机化星球
                </label>
                <label style="font-size: 11px; color: #aaa; cursor:pointer;">
                    <input type="checkbox" id="autoRandomSignals" checked> 随机化信号
                </label>
            </div>
            <button class="btn btn-warning" onclick="startBatchGeneration()" style="width:100%; margin-top:10px; justify-content: center;">
                ⚡ 开始批量任务
            </button>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="generateResult()" style="flex-grow: 1; justify-content: center;">🚀 单次生成</button>
        </div>

        <div class="config-card">
            <div class="panel-title">📡 信号 (3个) <span id="signalCount" style="color:#888">0/3</span></div>
            <div class="btn-group">
                <button class="btn" style="padding: 4px 8px; font-size: 10px;" onclick="randomizeSignals()">🎲 随机选</button>
            </div>
            <div id="signalList" class="item-list"></div>
        </div>

        <div class="config-card">
            <div class="panel-title">🪐 星球选择</div>
            <div class="btn-group">
                <button class="btn" style="padding: 4px 8px; font-size: 10px;" onclick="randomizePlanet()">🎲 随机选</button>
            </div>
            <div id="planetList" class="item-list"></div>
        </div>

        <div class="config-card">
            <div class="panel-title">⚙️ 参数微调</div>
            <label style="font-size:11px; color:#888">Temperature: <span id="tempValue">0.2</span></label>
            <input type="range" id="temperature" min="0.1" max="1.5" step="0.1" value="0.2" oninput="document.getElementById('tempValue').textContent=this.value">
            
            <label style="font-size:11px; color:#888; display:block; margin-top:8px">Max Tokens: <span id="tokensValue">80</span></label>
            <input type="range" id="maxTokens" min="20" max="200" step="10" value="80" oninput="document.getElementById('tokensValue').textContent=this.value">
        </div>
    </aside>

    <section class="scroll-panel" style="background: #16213e; position: relative;">
        <div id="loadingOverlay">
            <div class="spinner">🛸</div>
            <div>
                <p id="loadingText" style="font-size: 12px; margin: 0; font-weight: bold;">信号接收中...</p>
                <p id="batchProgress" style="font-size: 10px; color: #00d4ff; margin: 0;"></p>
            </div>
        </div>
        <div id="resultPanel">
            <div style="text-align: center; color: #444; padding-top: 120px;">
                <div style="font-size: 40px; margin-bottom: 20px;">📡</div>
                <p>等待初始化信号...</p>
            </div>
        </div>
    </section>

    <aside class="scroll-panel" style="border-left: 1px solid rgba(255,255,255,0.05);">
        <div class="panel-title">🕒 解码历史 (点击回溯)</div>
        <div id="historyList"></div>
    </aside>
</main>

<script>
    let signals = [];
    let planets = [];
    let history = [];
    let selectedSignals = new Set();
    let selectedPlanet = null;
    let isBatching = false;

    async function init() {
        try {
            const [sRes, pRes] = await Promise.all([
                fetch('/api/signals').then(r => r.json()),
                fetch('/api/planets').then(r => r.json())
            ]);
            signals = sRes;
            planets = pRes;
            renderSignals();
            renderPlanets();
            await loadHistory();
        } catch (e) {
            console.error("Initialization failed", e);
        }
    }

    // 渲染 UI
    function renderSignals() {
        const container = document.getElementById('signalList');
        container.innerHTML = signals.map(s => `
            <label class="signal-item">
                <input type="checkbox" value="${s.name}" ${selectedSignals.has(s.name) ? 'checked' : ''} 
                    onchange="toggleSignal('${s.name}')">
                <span>${s.name}</span>
            </label>
        `).join('');
        document.getElementById('signalCount').textContent = `${selectedSignals.size}/3`;
    }

    function renderPlanets() {
        const container = document.getElementById('planetList');
        container.innerHTML = planets.map(p => `
            <div class="planet-mini-card ${selectedPlanet === p.name ? 'selected' : ''}" 
                onclick="selectPlanet('${p.name}')">
                ${p.name}
                <span style="font-size:10px; color:#555; float:right">${p.civilization_type.split(' ')[0]}</span>
            </div>
        `).join('');
    }

    // 交互逻辑
    function toggleSignal(name) {
        if (selectedSignals.has(name)) {
            selectedSignals.delete(name);
        } else {
            if (selectedSignals.size >= 3) {
                const first = selectedSignals.values().next().value;
                selectedSignals.delete(first);
            }
            selectedSignals.add(name);
        }
        renderSignals(); 
    }

    function selectPlanet(name) {
        selectedPlanet = name;
        renderPlanets();
    }

    function randomizeSignals() {
        const shuffled = [...signals].sort(() => 0.5 - Math.random());
        selectedSignals = new Set(shuffled.slice(0, 3).map(s => s.name));
        renderSignals();
    }

    function randomizePlanet() {
        const random = planets[Math.floor(Math.random() * planets.length)];
        selectedPlanet = random.name;
        renderPlanets();
    }

    // 修改后的单次生成函数
    async function generateResult() {
        if (selectedSignals.size !== 3 || !selectedPlanet) {
            alert('配置未就绪：请确保选择了3个信号和1个星球');
            return;
        }

        const loader = document.getElementById('loadingOverlay');
        loader.style.display = 'flex'; // 显示右上角指示器
        
        try {
            const res = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    signal_names: Array.from(selectedSignals),
                    planet_name: selectedPlanet,
                    temperature: parseFloat(document.getElementById('temperature').value),
                    max_new_tokens: parseInt(document.getElementById('maxTokens').value)
                })
            });
            const data = await res.json();
            
            // 关键：只有当“当前不是批量模式”或者“批量模式的最后一步”时，才自动跳转显示最新结果
            // 这样可以防止用户在看历史记录时，被突然弹出的新结果打断
            if (!isBatching) {
                displayResult(data);
            }
            
            await updateHistoryList(); // 更新后台历史
        } catch (e) {
            console.error("通信异常", e);
        } finally {
            // 如果不是批量任务，生成完就隐藏
            if(!isBatching) loader.style.display = 'none';
        }
    }

    // 批量生成函数无需大改，只需在结束时隐藏 loader
    async function startBatchGeneration() {
        const count = parseInt(document.getElementById('batchCount').value);
        if (count < 1 || count > 50) return alert("建议数量 1-50 组");
        
        isBatching = true;
        const loader = document.getElementById('loadingOverlay');
        const progress = document.getElementById('batchProgress');
        loader.style.display = 'flex';
        
        const randomP = document.getElementById('autoRandomPlanet').checked;
        const randomS = document.getElementById('autoRandomSignals').checked;

        for (let i = 0; i < count; i++) {
            progress.textContent = `Progress: ${i + 1} / ${count}`;
            
            if (randomP) randomizePlanet();
            if (randomS) randomizeSignals();
            
            await generateResult();
        }

        isBatching = false;
        loader.style.display = 'none'; // 批量完成后隐藏
        alert("批量解码任务已完成，请在历史记录中查看。");
    }

    function displayResult(data) {
        const panel = document.getElementById('resultPanel');
        const meta = data.metadata || { 
            planet: { name: selectedPlanet }, 
            signals: Array.from(selectedSignals).map(n => ({name: n})),
            civilization_type: "未知",
            perception_style: "未知"
        };
        
        let contentHtml = '';
        if (data.sections) {
            contentHtml = Object.values(data.sections).map(s => `
                <div style="margin-bottom:18px">
                    <h4 style="color:#00d4ff; margin-bottom:6px; font-size:14px;">● ${s.title}</h4>
                    <p style="line-height:1.6; color:#bbb; font-size:13px">${s.content}</p>
                </div>
            `).join('');
        } else {
            // Display both original English and Chinese translation
            const englishContent = data.result || data.raw_text || "解码无有效负载";
            const chineseContent = data.translation || "";
            
            let translationDisplay = '';
            if (chineseContent && chineseContent !== englishContent) {
                translationDisplay = `
                    <div class="translation-section">
                        <h4 style="color:#ffcc00; margin:15px 0 5px 0; font-size:14px;">English Original:</h4>
                        <p style="line-height:1.6; color:#ccc; font-size:13px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 5px; margin-bottom: 15px">${englishContent}</p>
                        <h4 style="color:#00cc88; margin:15px 0 5px 0; font-size:14px;">中文翻译:</h4>
                        <p style="line-height:1.6; color:#ccc; font-size:13px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 5px;">${chineseContent}</p>
                    </div>
                `;
            } else {
                translationDisplay = `<p style="font-size:22px; color:#ccc;">${englishContent}</p>`;
            }
            
            contentHtml = translationDisplay;
        }

        // 添加完整文本显示部分
        let fullTextHtml = '';
        if (data.full_text) {
            fullTextHtml = `
            <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(0,212,255,0.1);">
                <h4 style="color:#00d4ff; margin-bottom:10px; font-size:14px;">🔬 Full Decoded Content / 完整解码内容</h4>
                <div style="background: rgba(0,0,0,0.2); padding: 12px; border-radius: 6px; max-height: 1200px; overflow-y: auto; font-size: 12px; line-height: 1.5; color: #aaa; white-space: pre-wrap;">
                    ${data.full_text.replace(/</g, '&lt;').replace(/>/g, '&gt;')}
                </div>
            </div>
            `;
        }

        panel.innerHTML = `
            <div class="result-card">
                <div class="meta-grid">
                    <div class="meta-box"><label>Observation Coordinates / 观测坐标</label><span>${meta.planet.name}</span></div>
                    <div class="meta-box"><label>Civilization Level / 文明等级</label><span>${meta.civilization_type}</span></div>
                    <div class="meta-box"><label>Perception Mode / 感知模态</label><span>${meta.perception_style}</span></div>
                    <div class="meta-box"><label>Feature Signals / 特征信号</label><span>${meta.signals.map(s=>s.name).join(' + ')}</span></div>
                </div>
                ${contentHtml}
                ${fullTextHtml}
            </div>
        `;
    }

    // 更新历史记录列表，从服务器获取最新数据
    async function updateHistoryList() {
        await loadHistory(); // 重新从服务器加载历史记录
    }

    function renderHistory() {
        const container = document.getElementById('historyList');
        container.innerHTML = history.map(h => `
            <div class="history-item" onclick="loadHistoryEntry(${h.id})" data-id="${h.id}">
                <div class="time">${h.time}</div>
                <div class="title">🪐 ${h.planet}</div>
                <div class="tags">📡 ${h.signals}</div>
            </div>
        `).join('');
    }

    function loadHistoryEntry(id) {
        const h = history.find(item => item.id === id);
        if (h) {
            // 高亮当前历史项
            document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));
            document.querySelector(`.history-item[data-id="${id}"]`)?.classList.add('active');

            // 还原参数并同步 UI
            selectedPlanet = h.planet;
            selectedSignals = new Set(h.signals.split(', '));
            renderPlanets();
            renderSignals();
            displayResult(h.fullData);
        }
    }

    async function saveHistory() {
        try {
            const response = await fetch('/api/history', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(history)
            });
            const result = await response.json();
            if (!result.success) {
                console.error('Failed to save history:', result.error);
            }
        } catch (e) {
            console.error('Error saving history:', e);
        }
    }

    async function loadHistory() {
        try {
            const response = await fetch('/api/history');
            if (response.ok) {
                history = await response.json();
                renderHistory();
            }
        } catch (e) {
            console.error('Error loading history:', e);
            history = []; // 初始化为空数组以防错误
        }
    }

    async function clearHistory() {
        if (confirm('确定抹除所有历史观测数据？')) {
            history = [];
            renderHistory();
            await saveHistory();
        }
    }
    
    function exportData() {
        const blob = new Blob([JSON.stringify(history)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url;
        a.download = `alien_export_${Date.now()}.json`; a.click();
    }
    
    function importData(input) {
        const reader = new FileReader();
        reader.onload = e => {
            try {
                const data = JSON.parse(e.target.result);
                history = Array.isArray(data) ? data : (data.history || []);
                renderHistory();
                saveHistory();
                alert("导入成功");
            } catch(e) { alert("导入失败：无效的 JSON 文件"); }
        };
        reader.readAsText(input.files[0]);
    }

    init();
</script>    
</body>
</html>
