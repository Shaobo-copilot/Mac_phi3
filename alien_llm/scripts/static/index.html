<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alien Signal Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            margin-bottom: 10px;
        }

        .toolbar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #dc3545 0%, #bd2130 100%);
            color: white;
        }

        .btn-random {
            background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
            color: #1a1a2e;
        }

        .input-section {
            display: flex;
            flex-direction: column;
        }
        
        .signals-container, .planet-container {
            display: inline-block;
            width: 48%;
            vertical-align: top;
        }
        
        /* 改进并排布局的对齐和间距 */
        .signals-container {
            margin-right: 2%;
        }
        
        .planet-container {
            margin-left: 2%;
        }
        
        .main-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .panel-title {
            font-size: 1.2em;
            color: #00d4ff;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(0, 212, 255, 0.3);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #aaa;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
        }

        .checkbox-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .checkbox-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .checkbox-item input[type="checkbox"] {
            margin-top: 4px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-info h4 {
            font-size: 14px;
            margin-bottom: 4px;
        }

        .checkbox-info p {
            font-size: 12px;
            color: #888;
        }

        .planet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
        }

        .planet-card {
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .planet-card:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .planet-card.selected {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
        }

        .planet-card h4 {
            color: #00d4ff;
            margin-bottom: 5px;
        }

        .planet-card p {
            font-size: 12px;
            color: #888;
        }

        .slider-container {
            margin-bottom: 15px;
        }

        .slider-value {
            float: right;
            color: #00d4ff;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #00d4ff;
            cursor: pointer;
        }

        .generate-btn {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            margin-top: 20px;
        }

        .result-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .result-card {
            background: rgba(0, 212, 255, 0.1);
            border-radius: 12px;
            padding: 25px;
            border-left: 4px solid #00d4ff;
        }

        .result-text {
            font-size: 1.1em;
            line-height: 1.8;
            color: #fff;
            margin-bottom: 20px;
        }

        .result-meta {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .meta-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
        }

        .meta-item h5 {
            color: #00d4ff;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .meta-item p {
            font-size: 13px;
            color: #ccc;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .history-table th,
        .history-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .history-table th {
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
            font-weight: 600;
        }

        .history-table tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .history-table button {
            padding: 6px 12px;
            font-size: 12px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .selected-count {
            background: #00d4ff;
            color: #1a1a2e;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛸 Alien Signal Generator</h1>
            <p style="color: #888;">外星文明信号解读器</p>
        </header>

        <div class="toolbar">
            <button class="btn btn-success" onclick="exportData()">
                📤 导出 JSON
            </button>
            <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">
                📥 导入 JSON
            </button>
            <input type="file" id="fileInput" accept=".json" onchange="importData(this)">
            <button class="btn btn-danger" onclick="clearHistory()">
                🗑️ 清空历史
            </button>
        </div>

        <div class="main-layout">
            <div class="left-panel">
                <div class="panel">
                    <h2 class="panel-title">⚙️ 参数配置</h2>
                    
                    <div class="input-section">
                        <div class="signals-container">
                            <div class="form-group">
                                <label class="form-label">
                                    选择信号 (3 个)
                                    <span class="selected-count" id="signalCount">0/3</span>
                                </label>
                                <div class="checkbox-group" id="signalList"></div>
                            </div>
                        </div>
                        
                        <div class="planet-container">
                            <div class="form-group">
                                <label class="form-label">选择星球</label>
                                <div class="planet-grid" id="planetList"></div>
                            </div>
                        </div>
                    </div>
                    
                    <button class="btn btn-random" onclick="randomizePlanet()" style="width: 49%; margin-bottom: 20px; display: inline-block;">
                        🎲 随机星球
                    </button>
                    <button class="btn btn-random" onclick="randomizeSignals()" style="width: 49%; margin-bottom: 20px; display: inline-block;">
                        🎲 随机信号
                    </button>

                    <div class="form-group">
                        <label class="form-label">
                            Temperature
                            <span class="slider-value" id="tempValue">0.7</span>
                        </label>
                        <div class="slider-container">
                            <input type="range" id="temperature" min="0.1" max="1.5" step="0.1" value="0.7" oninput="document.getElementById('tempValue').textContent=this.value">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            Max Tokens
                            <span class="slider-value" id="tokensValue">80</span>
                        </label>
                        <div class="slider-container">
                            <input type="range" id="maxTokens" min="20" max="200" step="10" value="80" oninput="document.getElementById('tokensValue').textContent=this.value">
                        </div>
                    </div>

                    <button class="btn btn-primary generate-btn" onclick="generateResult()">
                        🚀 生成结果
                    </button>
                </div>
            </div>

            <div class="right-panel">
                <div class="panel">
                    <h2 class="panel-title">✨ 生成结果</h2>
                    <div class="loading" id="loading">
                        <div class="spinner"></div>
                        <p>正在生成中...</p>
                    </div>
                    <div class="result-panel" id="resultPanel">
                        <div style="text-align: center; color: #666; padding: 40px;">
                            <p>配置参数后点击"生成结果"按钮</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="panel">
            <h2 class="panel-title">📊 历史记录</h2>
            <table class="history-table">
                <thead>
                    <tr>
                        <th>时间</th>
                        <th>信号</th>
                        <th>星球</th>
                        <th>结果预览</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="historyBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let signals = [];
        let planets = [];
        let history = [];
        let selectedSignals = new Set();
        let selectedPlanet = null;

        // 初始化
        async function init() {
            console.log('=== Starting initialization ===');
            try {
                await loadSignals();
                console.log('✓ Signals loaded:', signals.length);
            } catch (err) {
                console.error('✗ Failed to load signals:', err);
                document.getElementById('signalList').innerHTML = '<p style="color:red">Error: ' + err.message + '</p>';
            }
            try {
                await loadPlanets();
                console.log('✓ Planets loaded:', planets.length);
            } catch (err) {
                console.error('✗ Failed to load planets:', err);
                document.getElementById('planetList').innerHTML = '<p style="color:red">Error: ' + err.message + '</p>';
            }
            loadHistory();
            console.log('=== Initialization complete ===');
        }

        async function loadSignals() {
            console.log('📡 Fetching signals...');
            const res = await fetch('/api/signals');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            signals = await res.json();
            console.log('📥 Signals received:', signals.map(s => s.name));
            renderSignals();
        }

        async function loadPlanets() {
            console.log('🪐 Fetching planets...');
            const res = await fetch('/api/planets');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            planets = await res.json();
            console.log('📥 Planets received:', planets.map(p => p.name));
            renderPlanets();
        }

        function renderSignals() {
            const container = document.getElementById('signalList');
            container.innerHTML = signals.map(s => `
                <label class="checkbox-item">
                    <input type="checkbox" value="${s.name}" ${selectedSignals.has(s.name) ? 'checked' : ''} onchange="toggleSignal('${s.name}')">
                    <div class="checkbox-info">
                        <h4>${s.name}</h4>
                        <p>${s.semantic_tags.join(', ')}</p>
                    </div>
                </label>
            `).join('');
        }

        function renderPlanets() {
            const container = document.getElementById('planetList');
            container.innerHTML = planets.map(p => `
                <div class="planet-card ${selectedPlanet === p.name ? 'selected' : ''}" onclick="selectPlanet('${p.name}')">
                    <h4>${p.name}</h4>
                    <p><strong>文明:</strong> ${p.civilization_type}</p>
                    <p><strong>感知:</strong> ${p.perception_style}</p>
                </div>
            `).join('');
        }

        function toggleSignal(name) {
            if (selectedSignals.has(name)) {
                selectedSignals.delete(name);
            } else {
                if (selectedSignals.size >= 3) {
                    alert('最多选择 3 个信号！');
                    return;
                }
                selectedSignals.add(name);
            }
            updateSignalCount();
            renderSignals();
        }

        function selectPlanet(name) {
            selectedPlanet = name;
            renderPlanets();
        }

        function randomizePlanet() {
            const random = planets[Math.floor(Math.random() * planets.length)];
            selectedPlanet = random.name;
            renderPlanets();
        }

        function randomizeSignals() {
            // 随机选择3个信号
            const shuffled = [...signals].sort(() => 0.5 - Math.random());
            const randomSignals = shuffled.slice(0, 3);
            
            // 清除当前选择
            selectedSignals.clear();
            
            // 添加新选择
            randomSignals.forEach(signal => {
                selectedSignals.add(signal.name);
            });
            
            updateSignalCount();
            renderSignals();
        }

        function updateSignalCount() {
            document.getElementById('signalCount').textContent = `${selectedSignals.size}/3`;
        }

        async function generateResult() {
            if (selectedSignals.size !== 3) {
                alert('请选择 exactly 3 个信号！');
                return;
            }
            if (!selectedPlanet) {
                alert('请选择一个星球！');
                return;
            }

            document.getElementById('loading').classList.add('active');
            document.getElementById('resultPanel').innerHTML = '';

            const result = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    signal_names: Array.from(selectedSignals),
                    planet_name: selectedPlanet,
                    temperature: parseFloat(document.getElementById('temperature').value),
                    max_new_tokens: parseInt(document.getElementById('maxTokens').value)
                })
            }).then(res => res.json());

            document.getElementById('loading').classList.remove('active');
            displayResult(result);
            addToHistory(result);
        }

        function displayResult(data) {
            const planet = data.planet;
            const signals = data.signals.map(s => s.name).join(', ');
            
            document.getElementById('resultPanel').innerHTML = `
                <div class="result-card">
                    <div class="result-text">${escapeHtml(data.planet_analysis)}</div>
                    <div class="result-meta">
                        <div class="meta-item">
                            <h5>🪐 星球分析</h5>
                            <p>${escapeHtml(data.planet_analysis)}</p>
                        </div>
                    </div>
                </div>
                
                <div class="result-card">
                    <div class="result-text">${escapeHtml(data.civilization_analysis)}</div>
                    <div class="result-meta">
                        <div class="meta-item">
                            <h5>🏛️ 文明分析</h5>
                            <p>${escapeHtml(data.civilization_analysis)}</p>
                        </div>
                    </div>
                </div>
                
                <div class="result-card">
                    <div class="result-text">${escapeHtml(data.perception_analysis)}</div>
                    <div class="result-meta">
                        <div class="meta-item">
                            <h5>👁️ 感知分析</h5>
                            <p>${escapeHtml(data.perception_analysis)}</p>
                        </div>
                    </div>
                </div>
                
                <div class="result-card">
                    <div class="result-text">${escapeHtml(data.signal_analysis)}</div>
                    <div class="result-meta">
                        <div class="meta-item">
                            <h5>📡 信号分析</h5>
                            <p>${escapeHtml(data.signal_analysis)}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function addToHistory(data) {
            const entry = {
                id: Date.now(),
                timestamp: data.timestamp,
                signals: data.signals.map(s => s.name).join(', '),
                planet: data.planet.name,
                result: data.signal_analysis,
                planet_info: data.planet
            };
            history.unshift(entry);
            renderHistory();
            saveHistory();
        }

        function renderHistory() {
            const tbody = document.getElementById('historyBody');
            tbody.innerHTML = history.map(h => `
                <tr>
                    <td>${new Date(h.timestamp).toLocaleString()}</td>
                    <td>${h.signals}</td>
                    <td>${h.planet}</td>
                    <td style="max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${escapeHtml(h.result)}</td>
                    <td>
                        <button class="btn btn-primary" onclick="loadHistoryEntry(${h.id})">加载</button>
                    </td>
                </tr>
            `).join('');
        }

        function loadHistoryEntry(id) {
            const entry = history.find(h => h.id === id);
            if (entry) {
                selectedSignals = new Set(entry.signals.split(', ').filter(Boolean));
                selectedPlanet = entry.planet;
                updateSignalCount();
                renderSignals();
                renderPlanets();
                displayResult({
                    planet_analysis: "历史记录中的星球分析",
                    civilization_analysis: "历史记录中的文明分析", 
                    perception_analysis: "历史记录中的感知分析",
                    signal_analysis: entry.result,
                    planet: entry.planet_info,
                    signals: []
                });
            }
        }

        function clearHistory() {
            if (confirm('确定要清空所有历史记录吗？')) {
                history = [];
                renderHistory();
                saveHistory();
            }
        }

        function exportData() {
            const data = {
                history: history,
                exportedAt: new Date().toISOString()
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `alien_signals_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.history && Array.isArray(data.history)) {
                        history = data.history;
                        renderHistory();
                        saveHistory();
                        alert(`成功导入 ${history.length} 条记录！`);
                    } else {
                        alert('无效的 JSON 格式！');
                    }
                } catch (err) {
                    alert('读取文件失败：' + err.message);
                }
            };
            reader.readAsText(file);
            input.value = '';
        }

        function saveHistory() {
            localStorage.setItem('alien_signals_history', JSON.stringify(history));
        }

        function loadHistory() {
            const saved = localStorage.getItem('alien_signals_history');
            if (saved) {
                try {
                    history = JSON.parse(saved);
                    renderHistory();
                } catch (err) {
                    console.error('加载历史失败:', err);
                }
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 启动
        init();
    </script>
</body>
</html>
